# Заголовки безопасности сайта scr-system. Подключаются в server и в каждом location со своим add_header:
# nginx не наследует add_header из server, если в location есть свой.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $scr_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
