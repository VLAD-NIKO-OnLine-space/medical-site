# Сайт /var/www/scr-system — корень public/, всё, кроме файлов, обрабатывает public/index.php

# CSS и JS подключаются с меткой ?v=<время изменения> (asset() в lib.php): такой адрес меняется вместе с файлом,
# поэтому его можно кэшировать на год. Файлы без метки (картинки, шрифты, модули из vendor) — на 30 дней.
map $arg_v $scr_assets_cache {
    ""      "public, max-age=2592000";
    default "public, max-age=31536000, immutable";
}

# запрет показывать сайт во фрейме на чужих сайтах; админка ставит свой, более строгий DENY — тогда второй не добавляем
map $upstream_http_x_frame_options $scr_frame_options {
    ""      "SAMEORIGIN";
    default "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/scr-system/public;
    charset utf-8;
    client_max_body_size 8m;
    server_tokens off;

    include snippets/scr-headers.conf;

    location / {
        try_files $uri @php;
    }

    location ~ \.php$ {
        try_files /nonexistent @php;
    }

    location @php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $scr_assets_cache;
        include snippets/scr-headers.conf;
        access_log off;
    }

    # фавиконки и иконки для телефона лежат в корне
    location ~ ^/(favicon\.(ico|svg)|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$ {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/scr-headers.conf;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml image/x-icon;
}
