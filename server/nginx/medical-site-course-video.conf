# Include inside the HTTPS server for bestoncolog.ru.
location ^~ /course-video/ {
    include fastcgi_params;
    include snippets/medical-site-public-fpm.conf;
}

location ^~ /__course_video/ {
    internal;
    alias /var/lib/medical-site/course-video/;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-store" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    include snippets/medical-site-public-headers.conf;
    access_log off;
}
